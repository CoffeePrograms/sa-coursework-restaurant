      - "7.2. Тест-кейсы MVP": "07-proverka/7.2-test-keysy-mvp.md"
      - "7.3. Тест-кейсы Релиза 1": "07-proverka/7.3-test-keysy-reliza-1.md"
      - "7.4. Чек-лист приемки": "07-proverka/7.4-chek-list-priemki.md"
  - "Приложение А. Исходники схем": "prilozhenie-a.md"
  - "Спецификация API": "05-api/5.3-specifikaciya-openapi.md"
plugins:
  - search:
      lang: ru
  - swagger-ui-tag:
      docExpansion: list
      filter: true
      tryItOutEnabled: true
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
validation:
  absolute_links: warn
  unrecognized_links: warn
  omitted_files: warn
  anchors: warn
