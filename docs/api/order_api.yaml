openapi: "3.0.3"
info:
  title: "API системы «Приложение для заказа + табло»"
  version: "1.0.0"
  description: "Ресурсы раздела 5 курсового проекта. Для каждого ресурса приведены схемы запроса и ответа, примеры и коды ошибок. Суммы — строка в рублях, например «450.00»."
servers:
  - url: "/api/v1"
tags:
  - name: "Меню"
    description: "Меню, состав блюд и действующие акции"
  - name: "Лояльность"
    description: "Идентификация гостя во внешней системе лояльности"
  - name: "Заказы"
    description: "Проверка корзины, создание, отмена и статус заказа"
  - name: "Оплата"
    description: "Платежи на киоске и онлайн-оплата в приложении"
  - name: "Чеки"
    description: "Фискальные чеки и чеки возврата"
  - name: "Возвраты"
    description: "Оформление и подтверждение возвратов"
  - name: "Кухня"
    description: "Передача заказов на кухню и статусы производства"
  - name: "Торговый день"
    description: "Открытие, закрытие и статус торгового дня"
  - name: "Табло"
    description: "Номера и статусы заказов для табло"
  - name: "Киоск"
    description: "Поток событий и сбои киоска"
  - name: "Панель персонала"
    description: "Поиск заказов и уведомления о сбоях"
  - name: "Отзывы"
    description: "Оценки и отзывы гостей (Релиз 2)"
  - name: "Отчеты"
    description: "Отчеты для управляющего (Релиз 2)"
paths:
  /menu:
    get:
      tags:
        - "Меню"
      summary: "Меню"
      description: "Меню: категории и вложенные категории, блюда в продаже, цены, состав блюд с признаками изменения и наценками, действующие акции. Клиент: Киоск, приложение."
      security:
        - deviceToken: []
        - guestToken: []
      responses:
        "200":
          description: "Меню"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
              example:
                categories:
                  - categoryId: "a1a1a1a1-0000-4000-8000-000000000001"
                    name: "Бургеры"
                    parentCategoryId: null
                  - categoryId: "a1a1a1a1-0000-4000-8000-000000000002"
                    name: "Напитки"
                    parentCategoryId: null
                dishes:
                  - dishId: "3f1c2a10-7b5e-4c1d-9a2b-1e2f3a4b5c6d"
                    name: "Бургер классический"
                    description: "Говядина, томат, лук, соус"
                    price: "329.00"
                    categoryIds:
                      - "a1a1a1a1-0000-4000-8000-000000000001"
                    composition:
                      - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000001"
                        name: "Сыр"
                        inBaseComposition: false
                        canExclude: false
                        canAdd: true
                        addSurcharge: "40.00"
                        onSale: true
                      - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000002"
                        name: "Лук"
                        inBaseComposition: true
                        canExclude: true
                        canAdd: false
                        addSurcharge: "0.00"
                        onSale: true
                  - dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                    name: "Морс 0,4 л"
                    description: null
                    price: "120.00"
                    categoryIds:
                      - "a1a1a1a1-0000-4000-8000-000000000002"
                    composition: []
                promotions:
                  - promotionId: "PROMO-MORS-2FOR1"
                    name: "2 по цене 1 на морс"
                    type: "2 по цене 1"
                    startsAt: "2026-10-01T00:00:00+03:00"
                    endsAt: "2026-10-31T23:59:59+03:00"
                    dailyStartTime: "12:00"
                    dailyEndTime: "16:00"
                    value: null
                    status: "Активна"
                    dishes:
                      - dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                        promoPrice: "60.00"
                updatedAt: "2026-10-12T09:00:00+03:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /promotions:
    get:
      tags:
        - "Меню"
      summary: "Действующие акции с блюдами и ценой по акции"
      description: "Действующие акции с блюдами и ценой по акции. Клиент: Киоск, приложение."
      security:
        - deviceToken: []
        - guestToken: []
      responses:
        "200":
          description: "Действующие акции"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionList"
              example:
                items:
                  - promotionId: "PROMO-MORS-2FOR1"
                    name: "2 по цене 1 на морс"
                    type: "2 по цене 1"
                    startsAt: "2026-10-01T00:00:00+03:00"
                    endsAt: "2026-10-31T23:59:59+03:00"
                    dailyStartTime: "12:00"
                    dailyEndTime: "16:00"
                    value: null
                    status: "Активна"
                    dishes:
                      - dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                        promoPrice: "60.00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /loyalty-identifications:
    post:
      tags:
        - "Лояльность"
      summary: "Идентификация по QR"
      description: "Идентификация по QR: идентификатор гостя во внешней системе лояльности или признак анонимного заказа. Клиент: Киоск."
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyIdentificationRequest"
            example:
              qrCode: "LY:00012345:7f3a"
      responses:
        "200":
          description: "Результат идентификации"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyIdentification"
              example:
                result: "Распознан"
                loyaltyId: "LY-00012345"
                anonymous: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cart-checks:
    post:
      tags:
        - "Заказы"
      summary: "Проверка корзины"
      description: "Проверка корзины: пересчет цен с акциями и наценками, исключение снятых с продажи блюд и добавок, сообщения об изменениях. Заказ не создается. Клиент: Киоск, приложение."
      security:
        - deviceToken: []
        - guestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartCheckRequest"
            example:
              receiveType: "В зале"
              loyaltyId: null
              items:
                - dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                  quantity: 2
      responses:
        "200":
          description: "Пересчитанная корзина"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartCheckResult"
              example:
                items:
                  - dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                    name: "Морс 0,4 л"
                    quantity: 2
                    unitPrice: "120.00"
                    discountAmount: "0.00"
                    surchargeAmount: "0.00"
                    amount: "240.00"
                    promotionId: null
                    modifiers: []
                total: "240.00"
                changes:
                  - type: "Акция истекла"
                    dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                    promotionId: "PROMO-MORS-2FOR1"
                    message: "Акция «2 по цене 1» закончилась, сумма пересчитана"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "TRADING_DAY_CLOSED — торговый день закрыт"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      tags:
        - "Заказы"
      summary: "Создание заказа из корзины"
      operationId: "createOrder"
      description: "Создает заказ в статусе «Создан». Сумма рассчитывается по актуальным ценам, акциям и наценкам и фиксируется в позициях. Номер заказа присваивается при оплате."
      security:
        - deviceToken: []
        - guestToken: []
      parameters:
        - name: "Idempotency-Key"
          in: "header"
          required: true
          description: "UUID попытки создания заказа"
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              receiveType: "В зале"
              loyaltyId: "LY-00012345"
              expectedTotal: "858.00"
              items:
                - dishId: "3f1c2a10-7b5e-4c1d-9a2b-1e2f3a4b5c6d"
                  quantity: 2
                  modifiers:
                    - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000001"
                      action: "Добавлен"
                    - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000002"
                      action: "Исключен"
                - dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                  quantity: 2
      responses:
        "201":
          description: "Заказ создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: "Повторный запрос с тем же Idempotency-Key, возвращен ранее созданный заказ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /orders/{orderId}:
    get:
      tags:
        - "Заказы"
      summary: "Статус, номер и состав заказа"
      description: "Статус, номер и состав заказа. Клиент: Киоск, приложение."
      parameters:
        - name: "orderId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      security:
        - deviceToken: []
        - guestToken: []
      responses:
        "200":
          description: "Заказ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                orderId: "b7e2c1d4-5f6a-4b3c-9d8e-7f6a5b4c3d2e"
                number: "A-042"
                status: "Оплачен"
                receiveType: "В зале"
                loyaltyId: "LY-00012345"
                items:
                  - itemId: "0f9e8d7c-1111-4b3c-9d8e-000000000001"
                    dishId: "3f1c2a10-7b5e-4c1d-9a2b-1e2f3a4b5c6d"
                    name: "Бургер классический"
                    quantity: 2
                    unitPrice: "369.00"
                    discountAmount: "0.00"
                    surchargeAmount: "80.00"
                    amount: "738.00"
                    promotionId: null
                    modifiers:
                      - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000001"
                        name: "Сыр"
                        action: "Добавлен"
                        surcharge: "40.00"
                      - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000002"
                        name: "Лук"
                        action: "Исключен"
                        surcharge: "0.00"
                  - itemId: "0f9e8d7c-1111-4b3c-9d8e-000000000002"
                    dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                    name: "Морс 0,4 л"
                    quantity: 2
                    unitPrice: "60.00"
                    discountAmount: "120.00"
                    surchargeAmount: "0.00"
                    amount: "120.00"
                    promotionId: "PROMO-MORS-2FOR1"
                    modifiers: []
                total: "858.00"
                createdAt: "2026-10-12T12:30:15+03:00"
                statusChangedAt: "2026-10-12T12:31:00+03:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/cancel:
    post:
      tags:
        - "Заказы"
      summary: "Отмена заказа гостем или при завершении сеанса"
      description: "Отмена заказа гостем или при завершении сеанса. Клиент: Киоск, приложение."
      parameters:
        - name: "orderId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      security:
        - deviceToken: []
        - guestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
            example:
              reason: "Отмена гостем"
      responses:
        "200":
          description: "Заказ отменен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                orderId: "b7e2c1d4-5f6a-4b3c-9d8e-7f6a5b4c3d2e"
                number: null
                status: "Отменен"
                receiveType: "В зале"
                loyaltyId: "LY-00012345"
                items:
                  - itemId: "0f9e8d7c-1111-4b3c-9d8e-000000000001"
                    dishId: "3f1c2a10-7b5e-4c1d-9a2b-1e2f3a4b5c6d"
                    name: "Бургер классический"
                    quantity: 2
                    unitPrice: "369.00"
                    discountAmount: "0.00"
                    surchargeAmount: "80.00"
                    amount: "738.00"
                    promotionId: null
                    modifiers:
                      - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000001"
                        name: "Сыр"
                        action: "Добавлен"
                        surcharge: "40.00"
                      - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000002"
                        name: "Лук"
                        action: "Исключен"
                        surcharge: "0.00"
                  - itemId: "0f9e8d7c-1111-4b3c-9d8e-000000000002"
                    dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
                    name: "Морс 0,4 л"
                    quantity: 2
                    unitPrice: "60.00"
                    discountAmount: "120.00"
                    surchargeAmount: "0.00"
                    amount: "120.00"
                    promotionId: "PROMO-MORS-2FOR1"
                    modifiers: []
                total: "858.00"
                createdAt: "2026-10-12T12:30:15+03:00"
                statusChangedAt: "2026-10-12T12:33:00+03:00"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "ORDER_NOT_CANCELLABLE — статус не «Создан» и не «Ошибка оплаты» или есть платеж «В обработке»"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/stream:
    get:
      tags:
        - "Заказы"
      summary: "Поток статуса заказа (SSE, Релиз 1)"
      description: "Поток статуса заказа (SSE, Релиз 1). Клиент: Приложение."
      parameters:
        - name: "orderId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      security:
        - guestToken: []
      responses:
        "200":
          description: "Поток событий order-status, данные — схема OrderStatusEvent"
          content:
            text/event-stream:
              schema:
                type: "string"
                description: "Строки event и data; data — JSON по схеме из описания ответа"
              example: "event: order-status\ndata: {\"orderId\": \"b7e2c1d4-5f6a-4b3c-9d8e-7f6a5b4c3d2e\", \"number\": \"A-042\", \"status\": \"Готов\", \"statusChangedAt\": \"2026-10-12T12:45:00+03:00\"}\n\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/payments:
    post:
      tags:
        - "Оплата"
      summary: "Создание платежа"
      description: "Создание платежа: картой на киоске — в статусе «В обработке», наличными — «Успешно», в приложении — ссылка на оплату в платежном сервисе; приложение передает receiptEmail — e-mail для электронного чека. Клиент: Киоск, приложение."
      parameters:
        - name: "orderId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "Idempotency-Key"
          in: "header"
          required: true
          description: "UUID попытки"
          schema:
            type: "string"
            format: "uuid"
      security:
        - deviceToken: []
        - guestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            example:
              method: "Карта"
      responses:
        "201":
          description: "Платеж создан. Карта на киоске — «В обработке», наличные — «Успешно» и номер заказа, приложение — ссылка на оплату"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              example:
                paymentId: "5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a"
                orderId: "b7e2c1d4-5f6a-4b3c-9d8e-7f6a5b4c3d2e"
                method: "Карта"
                status: "В обработке"
                amount: "858.00"
                createdAt: "2026-10-12T12:30:40+03:00"
                externalTransactionId: null
                paymentUrl: null
                orderStatus: "Создан"
                orderNumber: null
        "200":
          description: "Повторный запрос с тем же Idempotency-Key, возвращен ранее созданный платеж"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              example:
                paymentId: "5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a"
                orderId: "b7e2c1d4-5f6a-4b3c-9d8e-7f6a5b4c3d2e"
                method: "Карта"
                status: "В обработке"
                amount: "858.00"
                createdAt: "2026-10-12T12:30:40+03:00"
                externalTransactionId: null
                paymentUrl: null
                orderStatus: "Создан"
                orderNumber: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "PAYMENT_IN_PROGRESS, ORDER_STATUS_CONFLICT или IDEMPOTENCY_CONFLICT"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payments/{paymentId}/result:
    post:
      tags:
        - "Оплата"
      summary: "Итоговый ответ терминала оплаты: «Успешно», «Ошибка» или потеря сигнала"
      description: "Итоговый ответ терминала оплаты: «Успешно», «Ошибка» или потеря сигнала. Клиент: Киоск."
      parameters:
        - name: "paymentId"
          in: "path"
          required: true
          schema:
            type: "string"
