      properties:
        status:
          type: "string"
          enum:
            - "Сформирован"
            - "Ошибка"
        fiscalDriveNumber:
          type: "string"
          description: "Заводской номер фискального накопителя"
        fiscalDocumentNumber:
          type: "string"
          description: "Номер фискального документа"
        fiscalSign:
          type: "string"
          description: "Фискальный признак документа"
        issuedAt:
          type: "string"
          format: "date-time"
          description: "Дата и время чека"
        errorMessage:
          type: "string"
