          enum:
            - "Карта"
            - "Наличные"
          nullable: true
        paidAt:
          type: "string"
          format: "date-time"
          nullable: true
        refund:
          allOf:
            - $ref: "#/components/schemas/Refund"
          description: "Есть, если по заказу оформлен возврат"
    StaffOrderList:
      type: "object"
      required:
        - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/StaffOrder"
    RatingRequest:
      type: "object"
      required:
        - "rating"
      properties:
        rating:
          type: "integer"
          minimum: 1
          maximum: 5
        comment:
          type: "string"
          maxLength: 1000
    Review:
      type: "object"
      required:
        - "reviewId"
        - "orderId"
        - "orderNumber"
        - "orderDate"
        - "rating"
        - "comment"
        - "createdAt"
      properties:
        reviewId:
          type: "string"
          format: "uuid"
        orderId:
          type: "string"
          format: "uuid"
        orderNumber:
          type: "string"
        orderDate:
          type: "string"
          format: "date"
        rating:
          type: "integer"
          minimum: 1
          maximum: 5
        comment:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
    ReviewList:
      type: "object"
      required:
        - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Review"
    Report:
      type: "object"
