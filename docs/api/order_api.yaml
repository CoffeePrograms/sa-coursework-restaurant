components:
  securitySchemes:
    deviceToken:
      type: "http"
      scheme: "bearer"
      description: "Токен киоска или табло"
    staffToken:
      type: "http"
      scheme: "bearer"
      description: "Токен сотрудника из Сервиса авторизации"
    guestToken:
      type: "http"
      scheme: "bearer"
      description: "Токен гостя из внешней системы лояльности"
    partnerToken:
      type: "http"
      scheme: "bearer"
      description: "Токен внешней системы: кухни, платежного сервиса или облачной кассы"
  responses:
    BadRequest:
      description: "VALIDATION_ERROR — нет позиций или способа получения, неверный формат"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHORIZED — нет токена или токен неверный"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "FORBIDDEN — у роли нет права на операцию"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "TRADING_DAY_CLOSED, TOTAL_CHANGED или IDEMPOTENCY_CONFLICT"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: "DISH_NOT_AVAILABLE или MODIFIER_NOT_ALLOWED"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "INTERNAL_ERROR"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: "VALIDATION_ERROR — неверный формат или нет обязательного поля"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "NOT_FOUND — ресурс не найден"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: "DEPENDENCY_UNAVAILABLE — недоступен внутренний сервис или внешняя система"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: "DEPENDENCY_UNAVAILABLE — недоступен Сервис меню или Сервис торгового дня"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Money:
      type: "string"
      pattern: "^\\d+\\.\\d{2}$"
      example: "450.00"
    ReceiveType:
      type: "string"
      enum:
        - "В зале"
        - "С собой"
    OrderStatus:
      type: "string"
      enum:
        - "Создан"
        - "Ошибка оплаты"
        - "Оплачен"
        - "Готовится"
        - "Готов"
        - "Выдан"
        - "Возврат"
        - "Отменен"
    ModifierAction:
      type: "string"
      enum:
        - "Исключен"
        - "Добавлен"
    ModifierInput:
      type: "object"
      required:
        - "ingredientId"
        - "action"
      properties:
        ingredientId:
          type: "string"
          format: "uuid"
        action:
          $ref: "#/components/schemas/ModifierAction"
    OrderItemInput:
      type: "object"
      required:
        - "dishId"
        - "quantity"
      properties:
        dishId:
          type: "string"
          format: "uuid"
        quantity:
          type: "integer"
          minimum: 1
        modifiers:
          type: "array"
          items:
            $ref: "#/components/schemas/ModifierInput"
    CreateOrderRequest:
      type: "object"
      required:
        - "receiveType"
        - "items"
      properties:
        receiveType:
          $ref: "#/components/schemas/ReceiveType"
        loyaltyId:
          type: "string"
          description: "Идентификатор гостя во внешней системе лояльности"
        expectedTotal:
          $ref: "#/components/schemas/Money"
        items:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    OrderModifier:
      type: "object"
      required:
        - "ingredientId"
        - "name"
        - "action"
        - "surcharge"
      properties:
        ingredientId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        action:
          $ref: "#/components/schemas/ModifierAction"
        surcharge:
          $ref: "#/components/schemas/Money"
    OrderItem:
      type: "object"
      required:
        - "itemId"
        - "dishId"
        - "name"
        - "quantity"
        - "unitPrice"
        - "discountAmount"
        - "surchargeAmount"
        - "amount"
        - "promotionId"
        - "modifiers"
      properties:
        itemId:
          type: "string"
          format: "uuid"
        dishId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        quantity:
          type: "integer"
        unitPrice:
          $ref: "#/components/schemas/Money"
        discountAmount:
          $ref: "#/components/schemas/Money"
        surchargeAmount:
          $ref: "#/components/schemas/Money"
        amount:
          $ref: "#/components/schemas/Money"
        promotionId:
          type: "string"
          nullable: true
        modifiers:
          type: "array"
          items:
            $ref: "#/components/schemas/OrderModifier"
    Order:
      type: "object"
      required:
        - "orderId"
        - "number"
        - "status"
        - "receiveType"
        - "loyaltyId"
        - "items"
        - "total"
        - "createdAt"
        - "statusChangedAt"
      properties:
        orderId:
          type: "string"
          format: "uuid"
        number:
          type: "string"
          nullable: true
          description: "Присваивается при статусе «Оплачен»"
        status:
          $ref: "#/components/schemas/OrderStatus"
        receiveType:
          $ref: "#/components/schemas/ReceiveType"
        loyaltyId:
          type: "string"
          nullable: true
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: "string"
          format: "date-time"
        statusChangedAt:
          type: "string"
          format: "date-time"
      example:
        orderId: "b7e2c1d4-5f6a-4b3c-9d8e-7f6a5b4c3d2e"
        number: null
        status: "Создан"
        receiveType: "В зале"
        loyaltyId: "LY-00012345"
        items:
          - itemId: "0f9e8d7c-1111-4b3c-9d8e-000000000001"
            dishId: "3f1c2a10-7b5e-4c1d-9a2b-1e2f3a4b5c6d"
            name: "Бургер классический"
            quantity: 2
            unitPrice: "369.00"
            discountAmount: "0.00"
            surchargeAmount: "80.00"
            amount: "738.00"
            promotionId: null
            modifiers:
              - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000001"
                name: "Сыр"
                action: "Добавлен"
                surcharge: "40.00"
              - ingredientId: "c1a2b3c4-0000-4a1b-8c2d-000000000002"
                name: "Лук"
                action: "Исключен"
                surcharge: "0.00"
          - itemId: "0f9e8d7c-1111-4b3c-9d8e-000000000002"
            dishId: "8a7b6c5d-4e3f-4a1b-8c2d-9e0f1a2b3c4d"
            name: "Морс 0,4 л"
            quantity: 2
            unitPrice: "60.00"
            discountAmount: "120.00"
            surchargeAmount: "0.00"
            amount: "120.00"
            promotionId: "PROMO-MORS-2FOR1"
            modifiers: []
        total: "858.00"
        createdAt: "2026-10-12T12:30:15+03:00"
        statusChangedAt: "2026-10-12T12:30:15+03:00"
    ReceiptResult:
      type: "object"
      required:
        - "status"
