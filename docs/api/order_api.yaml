      type: "string"
      enum:
        - "Карта"
        - "Наличные"
    PaymentStatus:
      type: "string"
      enum:
        - "В обработке"
        - "Успешно"
        - "Ошибка"
    RefundStatus:
      type: "string"
      enum:
        - "В обработке"
        - "Подтвержден"
        - "Отклонен"
        - "Ошибка"
    ReceiptType:
      type: "string"
      enum:
        - "Приход"
        - "Возврат прихода"
    ReceiptForm:
      type: "string"
      enum:
        - "Бумажный"
        - "Электронный"
    ReceiptStatus:
      type: "string"
      enum:
        - "Сформирован"
        - "Ошибка"
    TradingDayStatus:
      type: "string"
      enum:
        - "Открыт"
        - "Закрыт"
    PromotionType:
      type: "string"
      enum:
        - "Спеццена"
        - "Скидка"
