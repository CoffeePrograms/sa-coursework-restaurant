      required:
        - "periodFrom"
        - "periodTo"
        - "salesAmount"
        - "ordersCount"
        - "averageCheck"
        - "averagePreparationSeconds"
      properties:
        periodFrom:
          type: "string"
          format: "date"
        periodTo:
